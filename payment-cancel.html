<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment Cancelled | Boat4Two</title>
  <meta name="color-scheme" content="light dark" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#e65e19",
            "background-light": "#f8f6f6",
            "background-dark": "#061427"
          }
        }
      }
    };
  </script>
  <script>
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'boat4two-payment-result',
        status: 'cancelled'
      }, window.location.origin);
    }
  </script>
</head>
<body class="min-h-screen bg-background-light text-zinc-900">
  <main class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-xl rounded-[2rem] bg-white border border-zinc-200 shadow-xl p-8 text-center">
      <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-red-100">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-600" viewBox="0 0 24 24" fill="currentColor">
          <path d="M18.3 5.71 12 12l6.3 6.29-1.41 1.41L10.59 13.41 4.29 19.7 2.88 18.29 9.17 12 2.88 5.71 4.29 4.29l6.3 6.3 6.29-6.3z"/>
        </svg>
      </div>

      <p class="mt-6 text-sm font-semibold uppercase tracking-[0.2em] text-primary">Boat4Two</p>
      <h1 class="mt-3 text-3xl font-black">Payment cancelled</h1>
      <p class="mt-4 text-sm leading-relaxed text-zinc-600">
        Your payment was not completed, so your booking was not confirmed.
      </p>

      <div class="mt-6 rounded-2xl bg-zinc-100 p-4 text-sm text-zinc-700">
        If you still want this tour, please return to the booking flow and choose your date and time again.
      </div>

      <div class="mt-8 flex flex-col gap-3 sm:flex-row sm:justify-center">
        <a
          href="/#select-tour-popup"
          class="inline-flex h-12 items-center justify-center rounded-full bg-primary px-6 text-sm font-bold text-white shadow-lg transition-transform hover:scale-105"
        >
          Try Booking Again
        </a>
        <a
          href="https://wa.me/351932015013?text=Hello%20Boat4Two%2C%20my%20payment%20was%20cancelled%20and%20I%20need%20help%20with%20my%20booking."
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex h-12 items-center justify-center rounded-full border border-zinc-300 px-6 text-sm font-bold text-zinc-900 transition-colors hover:border-primary hover:text-primary"
        >
          Contact on WhatsApp
        </a>
      </div>
    </div>
  </main>
</body>
</html>

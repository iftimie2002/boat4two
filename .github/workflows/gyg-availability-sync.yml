name: Sync GetYourGuide availability

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Number of days to sync"
        required: false
        default: "30"
      sandbox:
        description: "Use GetYourGuide sandbox endpoint"
        required: false
        default: "0"

jobs:
  sync-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Ensure secret is configured
        run: |
          if [ -z "${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" ]; then
            echo "Missing DAILY_SYSTEM_CHECK_KEY GitHub secret." >&2
            exit 1
          fi

      - name: Trigger GetYourGuide availability sync
        env:
          SYNC_DAYS: ${{ github.event.inputs.days || '30' }}
          SYNC_SANDBOX: ${{ github.event.inputs.sandbox || '0' }}
        run: |
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --header "User-Agent: boat4two-gyg-availability-sync-bot" \
            --header "Authorization: Bearer ${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" \
            "https://boat4two.com/api/gyg-sync-availability?days=${SYNC_DAYS}&sandbox=${SYNC_SANDBOX}")

          cat "$RESPONSE_FILE"

          if [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
            echo ""
            echo "GetYourGuide availability sync failed with HTTP $STATUS_CODE" >&2
            exit 1
          fi

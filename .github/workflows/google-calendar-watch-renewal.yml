name: Renew Google Calendar webhook

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:

jobs:
  renew-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ensure secret is configured
        run: |
          if [ -z "${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" ]; then
            echo "Missing DAILY_SYSTEM_CHECK_KEY GitHub secret." >&2
            exit 1
          fi

      - name: Register Google Calendar watch channel
        run: |
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --header "User-Agent: boat4two-google-calendar-watch-renewal" \
            --header "Authorization: Bearer ${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" \
            https://boat4two.com/api/register-google-calendar-watch)

          cat "$RESPONSE_FILE"

          if [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
            echo ""
            echo "Google Calendar watch renewal failed with HTTP $STATUS_CODE" >&2
            exit 1
          fi

name: Daily system check

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: boat4two-daily-system-check
  cancel-in-progress: false

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run only at 08:00 Lisbon time
        id: schedule_gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_now=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LISBON_HOUR=$(TZ=Europe/Lisbon date +%H)
          if [ "$LISBON_HOUR" != "08" ]; then
            echo "run_now=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_now=true" >> "$GITHUB_OUTPUT"

      - name: Ensure secret is configured
        if: steps.schedule_gate.outputs.run_now == 'true'
        run: |
          if [ -z "${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" ]; then
            echo "Missing DAILY_SYSTEM_CHECK_KEY GitHub secret." >&2
            exit 1
          fi

      - name: Trigger daily system check
        if: steps.schedule_gate.outputs.run_now == 'true'
        run: |
          CHECK_URL="https://boat4two.com/api/daily-system-check"

          for ATTEMPT in 1 2 3; do
            RESPONSE_FILE=$(mktemp)
            STATUS_CODE=$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --header "User-Agent: boat4two-daily-check-bot" \
              --header "Authorization: Bearer ${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" \
              "$CHECK_URL" || true)
            STATUS_CODE=${STATUS_CODE:-000}

            cat "$RESPONSE_FILE"

            if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
              exit 0
            fi

            echo ""
            echo "Daily system check attempt $ATTEMPT failed with HTTP $STATUS_CODE" >&2

            if [ "$ATTEMPT" -lt 3 ]; then
              sleep 15
            fi
          done

          exit 1

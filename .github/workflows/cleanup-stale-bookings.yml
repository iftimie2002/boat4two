name: Cleanup stale booking slots

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "*/30 * * * *"
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger stale booking cleanup
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
        run: >
          curl --fail --silent --show-error
          --header "User-Agent: boat4two-cleanup-bot"
          https://boat4two.com/api/cleanup-holds

      - name: Ensure protected endpoint secret is configured
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *' || github.event.schedule == '17 */12 * * *'
        run: |
          if [ -z "${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" ]; then
            echo "Missing DAILY_SYSTEM_CHECK_KEY GitHub secret." >&2
            exit 1
          fi

      - name: Register Google Calendar watch channels
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 */12 * * *'
        run: |
          RESPONSE_FILE=$(mktemp)
          STATUS_CODE=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --header "User-Agent: boat4two-maintenance-bot" \
            --header "Authorization: Bearer ${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" \
            https://boat4two.com/api/register-google-calendar-watch)

          cat "$RESPONSE_FILE"

          if [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
            echo ""
            echo "Google Calendar watch renewal failed with HTTP $STATUS_CODE" >&2
            exit 1
          fi

      - name: Trigger GetYourGuide availability sync
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/30 * * * *' || github.event.schedule == '17 */12 * * *'
        run: |
          SYNC_URL="https://boat4two.com/api/gyg-sync-availability?days=365&batchDays=7&chain=1&stepDays=7&sandbox=0"

          for ATTEMPT in 1 2 3; do
            RESPONSE_FILE=$(mktemp)
            STATUS_CODE=$(curl --silent --show-error \
              --output "$RESPONSE_FILE" \
              --write-out "%{http_code}" \
              --header "User-Agent: boat4two-maintenance-bot" \
              --header "Authorization: Bearer ${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" \
              "$SYNC_URL" || true)
            STATUS_CODE=${STATUS_CODE:-000}

            cat "$RESPONSE_FILE"

            if [ "$STATUS_CODE" -ge 200 ] && [ "$STATUS_CODE" -lt 300 ]; then
              exit 0
            fi

            echo ""
            echo "GetYourGuide availability sync attempt $ATTEMPT failed with HTTP $STATUS_CODE" >&2

            if [ "$ATTEMPT" -lt 3 ]; then
              sleep 10
            fi
          done

          exit 1

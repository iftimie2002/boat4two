name: Daily conversion logbook

on:
  schedule:
    - cron: "10 6 * * *"
    - cron: "10 7 * * *"
    - cron: "10 8 * * *"
  workflow_dispatch:

concurrency:
  group: boat4two-daily-conversion-logbook
  cancel-in-progress: false

jobs:
  daily-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run only at 08:10 Lisbon time
        id: schedule_gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_now=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LISBON_TIME=$(TZ=Europe/Lisbon date +%H:%M)
          if [ "$LISBON_TIME" != "08:10" ]; then
            echo "run_now=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_now=true" >> "$GITHUB_OUTPUT"

      - name: Ensure secret is configured
        if: steps.schedule_gate.outputs.run_now == 'true'
        run: |
          if [ -z "${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" ]; then
            echo "Missing DAILY_SYSTEM_CHECK_KEY GitHub secret." >&2
            exit 1
          fi

      - name: Send daily conversion logbook
        if: steps.schedule_gate.outputs.run_now == 'true'
        run: |
          curl --fail-with-body --silent --show-error \
            --header "User-Agent: boat4two-daily-conversion-bot" \
            --header "Authorization: Bearer ${{ secrets.DAILY_SYSTEM_CHECK_KEY }}" \
            "https://boat4two.com/api/daily-conversion-report"
